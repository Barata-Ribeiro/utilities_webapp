packages:
    - '.'
allowBuilds:
    canvas: true
    esbuild: true
    msw: true
    sharp: true
overrides:
    'sharp': '^0.33.5'
    'sharp-ico': '^0.1.5'
    vite@*: 'catalog:'
    vitest@*: 'catalog:'
supportedArchitectures:
    os:
        - win32
        - darwin
        - current
    cpu:
        - x64
        - arm64
catalog:
    vite: npm:@voidzero-dev/vite-plus-core@0.3.0
    vitest: 4.1.11
    vite-plus: 0.3.0
    '@vitest/browser-playwright': 4.1.11
peerDependencyRules:
    allowAny:
        - vite
        - vitest
    allowedVersions:
        vite: '*'
        vitest: '*'
minimumReleaseAgeExclude:
    - '@react-router/dev@8.3.1'
    - '@react-router/express@8.3.1'
    - '@react-router/node@8.3.1'
    - '@react-router/serve@8.3.1'
    - lucide-react@1.37.0
    - react-router@8.3.1
    - zod@4.5.2
